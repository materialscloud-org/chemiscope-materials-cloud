name: Update Cached Dataset Index

on:
  schedule:
    - cron: "0 3 * * *" # every day at 03:00 UTC
  workflow_dispatch: # allow manual triggering

permissions:
  contents: write

jobs:
  update-cache:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # required for committing
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install

      - name: Run cache generation script
        run: npm run update-chemiscope-index

      - name: Commit and push if changed
        run: |
          if [[ -n "$(git status --porcelain public/chemiscope-datasets.json)" ]]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add public/chemiscope-datasets.json
            git commit -m "Update cached dataset index ($(date -u +"%Y-%m-%d"))"
            git push
          else
            echo "No changes detected, nothing to commit."
          fi
